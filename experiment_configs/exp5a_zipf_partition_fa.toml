# Experiment 5a-zipf: Partition-Aware Single Table (100% FastAppend, Zipf)
#
# Goal: Show that skewed partition selection concentrates conflicts on hot
# partitions, converging toward single-partition behavior.
#
# Same sweep as exp5a but with Zipf(alpha=1.5) partition selection. With 32
# partitions, alpha=1.5 puts ~45% of writes on the hottest partition. Even
# at partitions_per_txn=1, overlap probability on the hot partition is high.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Expected patterns:
#   - Worse throughput than exp5a (uniform) at all partitions_per_txn
#   - partitions_per_txn=1 + zipf ≈ single-table behavior (exp1)
#   - Higher partitions_per_txn compounds the skew effect

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp5a_zipf_partition_fa"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = false

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

operation_types.fast_append = 1.0
operation_types.validated_overwrite = 0.0
real_conflict_probability = 0.0

conflicting_manifests.distribution = "exponential"
conflicting_manifests.mean = 3.0
conflicting_manifests.min = 1
conflicting_manifests.max = 10
manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]
selection.distribution = "zipf"
selection.zipf_alpha = 1.5

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp5a_zipf_partition_fa"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
metrics = ["success_rate", "throughput", "mean_latency", "p99_latency"]
