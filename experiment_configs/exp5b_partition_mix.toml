# Experiment 5b: Partition-Aware Multi-Table Transactions (90/10 FA/VO Mix)
#
# Goal: Show how partition-level conflict detection interacts with operation cost.
#
# Same sweep as exp5a but with 90% FA / 10% VO mix. ValidatedOverwrite has
# higher retry cost (I/O convoy), so partition-level conflict detection
# should have a larger impact on VO latency and success rate.
#
# Multi-table transactions (tables_per_txn > 1) increase overlap probability,
# which triggers more VO I/O convoys. Partitions mitigate this.
#
# Sweep: num_tables x partitions_per_table x tables_per_txn x catalog_latency x arrival_rate (5D)
#   num_tables:          [10, 50]
#   partitions_per_table: [1, 10, 100]
#   tables_per_txn:      [1, 3]
#   catalog_latency:     [1, 50] ms
#   arrival_rate:        LOAD_SWEEP
#
# Operation types: 90% FastAppend, 10% ValidatedOverwrite
#
# Expected patterns:
#   - VO success rate degrades faster than FA as tables_per_txn increases
#   - More partitions reduce VO I/O convoy costs
#   - partitions_per_table=1, tables_per_txn=1 cross-validates against exp4b

[simulation]
duration_ms = 3600000  # 1 hour
output_path = "results.parquet"

[experiment]
label = "exp5b_partition_mix"

[catalog]
num_tables = 10          # Swept: [10, 50]
num_groups = 1           # Single-file catalog: all tables share one seq
table_metadata_inlined = false
backend = "service"

[catalog.partition]
num_partitions = 10      # Swept: [1, 10, 100]

[catalog.service]
provider = "instant"
latency_ms = 1.0         # Swept: [1, 50]

[transaction]
retry = 10
tables_per_txn = 1       # Swept: [1, 3]
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

# 90% FastAppend, 10% ValidatedOverwrite
operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1
real_conflict_probability = 0.0

conflicting_manifests.distribution = "exponential"
conflicting_manifests.mean = 3.0
conflicting_manifests.min = 1
conflicting_manifests.max = 10
manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Each txn writes 1 partition per table

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp5b_partition_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_table"
per_type_metrics = ["success_rate", "mean_latency"]
filters = ["catalog_service_latency_ms==1.0", "tables_per_txn==1", "num_tables==10"]
title_suffix = " (CAS=1ms, tpt=1, T=10)"
output_suffix = "cas_1ms_tpt1_t10"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_table"
per_type_metrics = ["success_rate", "mean_latency"]
filters = ["catalog_service_latency_ms==50.0", "tables_per_txn==1", "num_tables==10"]
title_suffix = " (CAS=50ms, tpt=1, T=10)"
output_suffix = "cas_50ms_tpt1_t10"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_table"
per_type_metrics = ["success_rate", "mean_latency"]
filters = ["catalog_service_latency_ms==1.0", "tables_per_txn==3", "num_tables==10"]
title_suffix = " (CAS=1ms, tpt=3, T=10)"
output_suffix = "cas_1ms_tpt3_t10"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_table"
per_type_metrics = ["success_rate", "mean_latency"]
filters = ["catalog_service_latency_ms==50.0", "tables_per_txn==3", "num_tables==10"]
title_suffix = " (CAS=50ms, tpt=3, T=10)"
output_suffix = "cas_50ms_tpt3_t10"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_table"
filters = ["catalog_service_latency_ms==1.0", "tables_per_txn==1", "num_tables==10"]
output_suffix = "cas_1ms_tpt1_t10"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_table"
filters = ["catalog_service_latency_ms==50.0", "tables_per_txn==1", "num_tables==10"]
output_suffix = "cas_50ms_tpt1_t10"

[[plots.graphs]]
type = "operation_types"
group_by = "catalog_service_latency_ms"
