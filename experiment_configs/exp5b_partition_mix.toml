# Experiment 5b: Partition-Aware Single Table (90/10 FA/VO, Uniform)
#
# Goal: Show how partition-level conflict detection interacts with VO cost.
#
# Same sweep as exp5a but with 90% FA / 10% VO. ValidatedOverwrite has
# higher retry cost (I/O convoy: historical ML reads). Partition-level
# conflict detection should have a larger impact on VO latency and success
# rate because disjoint-partition retries skip the convoy entirely.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Expected patterns:
#   - VO success rate degrades faster than FA as partitions_per_txn increases
#   - More partitions reduce VO I/O convoy costs (disjoint = free retry)
#   - partitions_per_txn=1: cross-validates against exp4b at num_tables=1

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp5b_partition_mix"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = false

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

# 90% FastAppend, 10% ValidatedOverwrite
operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1
real_conflict_probability = 0.0

conflicting_manifests.distribution = "exponential"
conflicting_manifests.mean = 3.0
conflicting_manifests.min = 1
conflicting_manifests.max = 10
manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp5b_partition_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
per_type_metrics = ["success_rate", "mean_latency"]

[[plots.graphs]]
type = "operation_types"
group_by = "partitions_per_txn"
