# Experiment 4b-zipf: Multi-Table Catalog Contention with Zipf Selection (90/10 Mix)
#
# Goal: Show how Zipf table selection interacts with operation cost in mixed workloads.
#
# Same sweep as exp4a-zipf but with 90% FA / 10% VO mix. Zipf concentrates
# writes on hot tables, and ValidatedOverwrite has higher retry cost (manifest
# reads + writes). The combination should amplify contention effects beyond
# what either Zipf or VO alone would cause. Compare against exp4b (uniform).
#
# Sweep: num_tables x catalog_latency x arrival_rate (3D)
#   num_tables:      [1, 2, 5, 10, 20, 50]
#   catalog_latency: [1, 10, 50, 120] ms (instant -> GCP range)
#   arrival_rate:    LOAD_SWEEP
#
# Operation types: 90% FastAppend, 10% ValidatedOverwrite
#
# Expected patterns:
#   - VO success rate degrades faster than in exp4b (Zipf hot tables amplify retry cost)
#   - Zipf + VO + high table count = multiplicative degradation
#   - num_tables=1 should match exp4b (Zipf over 1 table = uniform)
#
# Validation:
#   - Operation type distribution matches ~90/10 (within sampling variance)
#   - No validation_exception aborts (real_conflict_probability = 0)
#   - num_tables=1 cross-validates against exp4b

[simulation]
duration_ms = 3600000  # 1 hour
output_path = "results.parquet"

[experiment]
label = "exp4b_zipf_tables_mix"

[catalog]
num_tables = 1           # Swept: [1, 2, 5, 10, 20, 50]
num_groups = 1           # Single-file catalog: all tables share one seq
table_metadata_inlined = true
backend = "service"

[catalog.service]
provider = "instant"
latency_ms = 1.0         # Swept: [1, 10, 50, 120]

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

# 90% FastAppend, 10% ValidatedOverwrite (realistic mixed workload)
operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1

# No real conflicts — isolates catalog latency + operation-type cost
real_conflict_probability = 0.0

conflicting_manifests.distribution = "exponential"
conflicting_manifests.mean = 3.0
conflicting_manifests.min = 1
conflicting_manifests.max = 10
manifest_list_mode = "rewrite"

[transaction.table_selection]
distribution = "zipf"
zipf_alpha = 1.5

[storage]
provider = "s3"  # Fixed S3 storage (catalog latency swept separately)
max_parallel = 4

[plots]
output_dir = "plots/exp4b_zipf_tables_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "num_tables"
per_type_metrics = ["success_rate", "mean_latency"]
xheatmap_only = true
filters = ["catalog_service_latency_ms==1.0"]
title_suffix = " (Zipf, CAS=1ms)"
output_suffix = "cas_1ms"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "num_tables"
per_type_metrics = ["success_rate", "mean_latency"]
xheatmap_only = true
filters = ["catalog_service_latency_ms==10.0"]
title_suffix = " (Zipf, CAS=10ms)"
output_suffix = "cas_10ms"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "num_tables"
per_type_metrics = ["success_rate", "mean_latency"]
xheatmap_only = true
filters = ["catalog_service_latency_ms==50.0"]
title_suffix = " (Zipf, CAS=50ms)"
output_suffix = "cas_50ms"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "num_tables"
per_type_metrics = ["success_rate", "mean_latency"]
xheatmap_only = true
filters = ["catalog_service_latency_ms==120.0"]
title_suffix = " (Zipf, CAS=120ms)"
output_suffix = "cas_120ms"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "num_tables"
filters = ["catalog_service_latency_ms==1.0"]
output_suffix = "cas_1ms"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "num_tables"
filters = ["catalog_service_latency_ms==10.0"]
output_suffix = "cas_10ms"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "num_tables"
filters = ["catalog_service_latency_ms==50.0"]
output_suffix = "cas_50ms"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "num_tables"
filters = ["catalog_service_latency_ms==120.0"]
output_suffix = "cas_120ms"

[[plots.graphs]]
type = "operation_types"
group_by = "catalog_service_latency_ms"

[[plots.graphs]]
type = "per_table_breakdown"
filters = ["catalog_service_latency_ms==1.0"]
load_levels = [50, 100, 200]
num_tables_values = [10, 50]
output_suffix = "cas_1ms"
