# Experiment 6b-zipf: Inlined Table Manifest (90/10 FA/VO, Zipf)
#
# Goal: Inlined metadata with skewed partition selection and VO.
#
# Same sweep as exp5b-zipf, but with inlined metadata. Per-attempt ML I/O
# is eliminated, but the VO I/O convoy remains. The combination of
# hot-partition skew and growing CAS payload tests whether inlining's
# per-attempt savings can compensate for skewed access patterns.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp6b_zipf_inlined_mix"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = true
initial_partition_size_bytes = 2048
commit_growth_bytes = 100

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1
real_conflict_probability = 0.0

conflicting_manifests.distribution = "exponential"
conflicting_manifests.mean = 3.0
conflicting_manifests.min = 1
conflicting_manifests.max = 10
manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]
selection.distribution = "zipf"
selection.zipf_alpha = 1.5

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp6b_zipf_inlined_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
per_type_metrics = ["success_rate", "mean_latency"]

[[plots.graphs]]
type = "operation_types"
group_by = "partitions_per_txn"
