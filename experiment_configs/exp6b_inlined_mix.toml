# Experiment 6b: Inlined Table Manifest (90/10 FA/VO, Uniform)
#
# Goal: Show how inlining interacts with VO retry cost.
#
# Same sweep as exp5b, but with inlined metadata. Inlining eliminates ML
# reads and writes from per-attempt cost (2 fewer S3 ops per partition per
# attempt). The VO I/O convoy (historical ML reads) is NOT eliminated —
# historical MLs must still be read to validate the read set.
#
# Compared to exp5b: each retry attempt is cheaper (j MF writes vs 3j ops),
# but the convoy cost remains.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Expected patterns:
#   - Per-attempt cost lower than exp5b (ML I/O eliminated)
#   - VO convoy cost remains (historical ML reads still needed)
#   - Throughput degrades over time (CAS payload growth)

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp6b_inlined_mix"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = true
initial_partition_size_bytes = 16000  # 32 partitions * ~16 KiB = ~500 KiB steady-state
commit_growth_bytes = 0              # Fixed size (trimming/compression at equilibrium)

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1
real_conflict_probability = 0.0

manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp6b_inlined_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
per_type_metrics = ["success_rate", "mean_latency"]

[[plots.graphs]]
type = "operation_types"
group_by = "partitions_per_txn"
