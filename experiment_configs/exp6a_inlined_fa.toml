# Experiment 6a: Inlined Table Manifest (100% FastAppend, Uniform)
#
# Goal: Show the tradeoff of inlining the table manifest in the catalog CAS.
#
# Same sweep as exp5a, but with table_metadata_inlined=true. The catalog CAS
# payload includes the table manifest, eliminating ML reads and writes on each
# attempt. All ML I/O is absorbed into the (growing) CAS operation.
#
# Tradeoff: early commits are faster (no ML round-trips), but the CAS payload
# grows with each successful commit, increasing CAS latency over time.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Fixed: num_tables=1, partitions_per_table=32, S3 catalog CAS
# Inlining: fixed 500 KiB catalog (32 partitions × ~16 KiB steady-state)
#
# Expected patterns:
#   - Throughput degrades over time as CAS payload grows
#   - Initially faster than exp5a (no ML I/O), later slower (CAS growth)
#   - commit_rate_over_time should show downward curve (vs exp5a flat)

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp6a_inlined_fa"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = true
initial_partition_size_bytes = 16000  # 32 partitions * ~16 KiB = ~500 KiB steady-state
commit_growth_bytes = 0              # Fixed size (trimming/compression at equilibrium)

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

operation_types.fast_append = 1.0
operation_types.validated_overwrite = 0.0
real_conflict_probability = 0.0

manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp6a_inlined_fa"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "overhead_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "success_rate_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
metrics = ["success_rate", "throughput", "mean_latency", "p99_latency"]
