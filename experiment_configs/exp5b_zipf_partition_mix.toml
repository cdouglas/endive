# Experiment 5b-zipf: Partition-Aware Single Table (90/10 FA/VO, Zipf)
#
# Goal: Show VO cost under skewed partition selection.
#
# Same sweep as exp5b but with Zipf(alpha=1.5) partition selection.
# Hot partitions amplify VO I/O convoy costs because the overlap probability
# on the hottest partition is high regardless of partitions_per_txn.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Expected patterns:
#   - VO success rate much worse than exp5b (uniform) at same parameters
#   - Zipf concentrates conflicts on hot partitions even at k=1

[simulation]
duration_ms = 3600000
output_path = "results.parquet"

[experiment]
label = "exp5b_zipf_partition_mix"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = false

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

operation_types.fast_append = 0.9
operation_types.validated_overwrite = 0.1
real_conflict_probability = 0.0

manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]
selection.distribution = "zipf"
selection.zipf_alpha = 1.5

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp5b_zipf_partition_mix"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "overhead_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "success_rate_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
metrics = ["success_rate", "throughput", "mean_latency", "p99_latency"]
per_type_metrics = ["success_rate", "mean_latency"]

[[plots.graphs]]
type = "operation_types"
group_by = "partitions_per_txn"
