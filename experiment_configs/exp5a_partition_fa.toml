# Experiment 5a: Partition-Aware Single Table (100% FastAppend, Uniform)
#
# Goal: Show that partitioning a table reduces commit conflict costs.
#
# With 32 partitions per table and uniform selection, concurrent writers
# targeting disjoint partitions retry for free (catalog re-read + CAS only).
# As partitions_per_txn increases, overlap probability grows and free retries
# become rarer.
#
# Since the catalog is a file, atomic multi-partition commits are free.
# Partitioning a table is isomorphic to splitting into sub-tables: each
# partition has its own manifest list, and disjoint writes skip ML I/O
# on retry.
#
# Sweep: arrival_rate x partitions_per_txn (2D)
#   arrival_rate:       LOAD_SWEEP
#   partitions_per_txn: [1, 2, 4, 8, 16]
#
# Fixed: num_tables=1, partitions_per_table=32, S3 catalog CAS
# Operation types: 100% FastAppend
# Partition selection: uniform random
#
# Expected patterns:
#   - partitions_per_txn=1: throughput approaches catalog-limited ceiling
#     (similar to distributing load across 32 tables in exp4)
#   - partitions_per_txn=16: converges to single-partition behavior (exp1)
#   - Smooth degradation between these extremes
#
# Validation:
#   - All operation_type values should be "fast_append"
#   - catalog_conflicts should dominate at low partitions_per_txn
#   - tblptn_conflicts should dominate at high partitions_per_txn

[simulation]
duration_ms = 3600000  # 1 hour
output_path = "results.parquet"

[experiment]
label = "exp5a_partition_fa"

[catalog]
num_tables = 1
num_groups = 1
table_metadata_inlined = false

[catalog.partition]
num_partitions = 32

[transaction]
retry = 10
runtime.min = 30000
runtime.mean = 180000
runtime.sigma = 1.5

inter_arrival.distribution = "exponential"
inter_arrival.scale = 100.0  # Swept: LOAD_SWEEP

# 100% FastAppend
operation_types.fast_append = 1.0
operation_types.validated_overwrite = 0.0
real_conflict_probability = 0.0

manifest_list_mode = "rewrite"

[partition]
enabled = true
partitions_per_txn = 1   # Swept: [1, 2, 4, 8, 16]

[storage]
provider = "s3"
max_parallel = 4

[plots]
output_dir = "plots/exp5a_partition_fa"

[[plots.graphs]]
type = "commit_rate_over_time"

[[plots.graphs]]
type = "latency_vs_throughput"
group_by = "partitions_per_txn"

[[plots.graphs]]
type = "heatmap"
x_param = "inter_arrival_scale"
y_param = "partitions_per_txn"
metrics = ["success_rate", "throughput", "mean_latency", "p99_latency"]
